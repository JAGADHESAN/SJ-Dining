<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SJ Dining | Book a Table</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link rel="stylesheet" href="css/booking.css">

</head>

<body>

<header class="navbar">

    <div class="logo">
        SJ Dining
    </div>

    <nav>

        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>

    </nav>

</header>


<main class="booking-page">

    <div class="booking-container">

        <div class="booking-heading">

            <p class="section-small-title">
                SJ DINING
            </p>

            <h1>Book Your Table</h1>

            <p>
                Fill in your details and send your
                booking request directly to SJ Dining.
            </p>

        </div>


        <form id="bookingForm">

            <div class="form-group">

                <label for="name">
                    Your Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required>

            </div>


            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>

            </div>


            <div class="form-group">

                <label for="people">
                    Number of People
                </label>

                <input
                    type="number"
                    id="people"
                    name="people"
                    min="1"
                    max="30"
                    placeholder="Example: 4"
                    required>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required>

                </div>


                <div class="form-group">

                    <label for="time">
                        Time
                    </label>

                    <input
                        type="time"
                        id="time"
                        name="time"
                        required>

                </div>

            </div>


            <div class="form-group">

                <label for="requirements">
                    Special Requirements
                </label>

                <textarea
                    id="requirements"
                    name="requirements"
                    rows="4"
                    placeholder="Birthday, family dinner, special seating, etc."></textarea>

            </div>


            <button
                type="submit"
                class="booking-submit">

                Send Booking via WhatsApp

            </button>

        </form>


        <p class="booking-note">

            Your booking request will open
            WhatsApp with the entered details.

        </p>

    </div>

</main>


<footer>

    <div class="footer-content">

        <h2>SJ Dining</h2>

        <p>
            Open Daily: 10:00 AM - 10:00 PM
        </p>

    </div>

</footer>


<script src="js/booking.js"></script>

</body>

</html>
